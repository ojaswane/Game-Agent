logLevel: info

rtmp: yes
rtmpAddress: :1935

hls: no

webrtc: yes

# This is for browser connection setup
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# TODO ; For playback from another computer, replace this with the server laptop's
# LAN IP. For internet access, use the server's public IP/domain and configure
# firewall/NAT plus STUN/TURN as required by your network.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path: ~^live/.+$
      - action: read
        path: ~^live/.+$
  - user: any
    pass:
    ips: [127.0.0.1, ::1]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

paths:
  all_others: {}
