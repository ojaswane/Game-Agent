services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    restart: unless-stopped
    volumes:
      - ./streaming/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "1935:1935/tcp" # RTMP ingest from the gaming agent
      - "8889:8889/tcp" # WebRTC playback/signaling and built-in player
      - "8189:8189/udp" # WebRTC media (ICE)

  viewer:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80/tcp"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - mediamtx
